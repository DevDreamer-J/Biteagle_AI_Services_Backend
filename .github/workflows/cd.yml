name: CD

on:
  # 门禁：只有 main 上的 CI 跑完且成功后才发布
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  # tag 发布与手动触发不经 CI 门禁（CI 不在 tag 上运行）
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# 发布任务不取消进行中的运行，避免镜像推送被中断
concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # CI 触发时必须成功；tag / 手动触发直接发布
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      - uses: actions/checkout@v5
        with:
          # workflow_run 时检出 CI 实际验证过的提交，而不是默认分支当前 HEAD
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          # 仓库名含大写字母，Docker 引用必须全小写
          images: ghcr.io/devdreamer-j/biteagle_ai_services_backend
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # 覆盖 Dockerfile 默认的阿里云源
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: |
          echo "镜像已推送：$(echo '${{ steps.meta.outputs.tags }}' | tr '\n' ' ')" >> "$GITHUB_STEP_SUMMARY"
          echo "digest: ${{ steps.build.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"
