name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 只读权限即可完成 lint / test / 构建校验
permissions:
  contents: read

# 同分支连续 push 只保留最新一次运行
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app -d app"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      ENVIRONMENT: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      REDIS_URL: redis://localhost:6379/1
      # 测试用 eager 模式，不需要 RabbitMQ
      RABBITMQ_HOST: localhost
      RABBITMQ_PORT: "5672"

    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff check)
        run: ruff check app tests

      - name: Format check (ruff format)
        run: ruff format --check app tests

      - name: Run tests
        run: pytest tests/ -v

  # 校验部署产物：镜像必须能构建并真正启动
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          push: false
          load: true
          tags: ai-services-backend:ci
          # 覆盖 Dockerfile 默认的阿里云源，GitHub runner 直连 PyPI 更快
          build-args: |
            PIP_INDEX_URL=https://pypi.org/simple
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test image
        run: |
          trap 'docker rm -f smoke >/dev/null 2>&1 || true' EXIT
          docker run -d --name smoke -p 18000:8000 ai-services-backend:ci
          for i in $(seq 1 15); do
            if curl -fsS http://127.0.0.1:18000/health/live; then
              echo "smoke test passed"
              exit 0
            fi
            sleep 1
          done
          echo "smoke test failed"
          docker logs smoke
          exit 1
